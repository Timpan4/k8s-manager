name: CodSpeed

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect benchmark changes
    runs-on: ubuntu-latest
    outputs:
      benchmarks: ${{ steps.detect.outputs.benchmarks }}

    steps:
      - name: Checkout
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Rust, Svelte, or JavaScript changes
        id: detect
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "benchmarks=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            echo "No usable base commit; running benchmarks."
            echo "benchmarks=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git diff --name-only --no-renames "${BASE_SHA}" "${HEAD_SHA}" | tee /tmp/kubecove-changed-files.txt
          if grep -Eiq '\.(rs|svelte|js|jsx|mjs|cjs|ts|tsx|mts|cts)$' /tmp/kubecove-changed-files.txt; then
            echo "benchmarks=true" >> "${GITHUB_OUTPUT}"
          else
            echo "benchmarks=false" >> "${GITHUB_OUTPUT}"
          fi

  benchmarks:
    name: Run benchmarks
    needs:
      - changes
    if: ${{ needs.changes.outputs.benchmarks == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release/app-v') || !contains(github.event.pull_request.labels.*.name, 'release')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          shared-key: kubecove-rust-codspeed
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --version 5.0.1 --locked

      - name: Build Rust benchmarks
        working-directory: src-tauri
        run: cargo codspeed build --features bench-support --bench backend_hot_paths --locked

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5.2.1
        with:
          mode: simulation
          run: bunx vitest bench --run && cd src-tauri && cargo codspeed run --bench backend_hot_paths

  check:
    name: CodSpeed Performance Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - benchmarks
    if: always()

    steps:
      - name: Verify benchmark result
        env:
          BENCHMARK_RESULT: ${{ needs.benchmarks.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          RELEASE_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/app-v') && contains(github.event.pull_request.labels.*.name, 'release') }}
          SOURCE_CHANGES: ${{ needs.changes.outputs.benchmarks }}
        run: |
          set -euo pipefail
          echo "Change detection: ${CHANGES_RESULT}"
          echo "Benchmark-relevant changes: ${SOURCE_CHANGES}"
          echo "Benchmark result: ${BENCHMARK_RESULT}"
          test "${CHANGES_RESULT}" = "success"
          if [[ "${RELEASE_PR}" == "true" || "${SOURCE_CHANGES}" == "false" ]]; then
            test "${BENCHMARK_RESULT}" = "skipped"
          else
            test "${SOURCE_CHANGES}" = "true"
            test "${BENCHMARK_RESULT}" = "success"
          fi
